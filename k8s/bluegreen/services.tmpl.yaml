apiVersion: v1
kind: Service
metadata:
  name: shopease-live
  namespace: shopease-bg
spec:
  type: NodePort
  selector:
    app: shopease
    color: LIVE_PLACEHOLDER
  ports:
    - port: 80
      targetPort: 3000
      nodePort: 30081
---
apiVersion: v1
kind: Service
metadata:
  name: shopease-preview
  namespace: shopease-bg
spec:
  type: NodePort
  selector:
    app: shopease
    color: PREVIEW_PLACEHOLDER
  ports:
    - port: 80
      targetPort: 3000
      nodePort: 30082

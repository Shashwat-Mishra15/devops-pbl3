apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopease
  namespace: shopease
  labels:
    app: shopease
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shopease
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: shopease
    spec:
      imagePullSecrets:
        - name: ecr-pull
      containers:
        - name: shopease
          image: IMAGE_PLACEHOLDER
          ports:
            - containerPort: 3000
          env:
            - name: APP_VERSION
              value: "VERSION_PLACEHOLDER"
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi

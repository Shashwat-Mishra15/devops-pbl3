apiVersion: apps/v1
kind: Deployment
metadata:
  name: medicare
  namespace: medicare
  labels:
    app: medicare
spec:
  replicas: 2
  selector:
    matchLabels:
      app: medicare
  template:
    metadata:
      labels:
        app: medicare
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ecr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: medicare
          image: IMAGE_PLACEHOLDER
          ports:
            - containerPort: 3000
          env:
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: medicare-secrets
                  key: api-token
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: medicare-secrets
                  key: encryption-key
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
